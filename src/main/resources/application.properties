spring.application.name=ecommerce-app
# --- Server Configuration ---
server.port=8081

# --- MySQL Database Configuration ---
spring.datasource.url=jdbc:mysql://localhost:3306/order_db?createDatabaseIfNotExist=true
spring.datasource.username=ecommerceapp
spring.datasource.password=ecommerceapp
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- Hibernate / JPA Settings ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.kafka.producer.retries=3
spring.kafka.producer.properties.retry.backoff.ms=100
spring.kafka.consumer.group-id=order-group
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.edu.model

# --- Kafka Producer Settings ---
spring.kafka.bootstrap-servers=localhost:9092
# Serializers convert Java objects into bytes for Kafka
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# --- Security Settings ---
# Ensure your JWT secret matches across all services
app.jwt.secret=SecretKeyToGenJWTsSecretKeyToGenJWTsSecretKeyToGenJWTs
app.jwt.expiration=86400000
